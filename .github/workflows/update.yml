name: Update schedule

on:
  schedule:
    # Every 30 minutes, off the top of the hour to avoid the busiest cron slots. GitHub often
    # delays or skips these, so cron-job.org also dispatches the workflow (see the cron job).
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      sync_cron:
        description: Also create or update the cron-job.org trigger
        type: boolean
        default: false
  push:
    branches: [main]

# Never run two updates at once; a queued run waits instead of cancelling a deploy mid-way.
concurrency:
  group: update-schedule
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    name: Fetch, validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read # look up the published site URL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install image parser
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ukr
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-image.txt

      - name: Test image extraction
        run: .venv/bin/python -m unittest discover -s test -p '*_test.py'

      - name: Run deterministic tests
        run: npm test

      - name: Find published site
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url) || {
            echo "::error::GitHub Pages is not enabled. Settings → Pages → Source: GitHub Actions."
            exit 1
          }
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"

      - name: Fetch and validate source
        timeout-minutes: 5
        env:
          PREVIOUS_URL: ${{ steps.pages.outputs.url }}/data/latest.json
          PYTHON: .venv/bin/python
        run: node scripts/update.js --previous-url "$PREVIOUS_URL"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.run_id }}
          path: diagnostics/
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/

  deploy:
    name: Deploy to GitHub Pages
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  keepalive:
    # GitHub disables scheduled workflows after 60 days without repository activity. Data is not
    # committed, so re-enable this workflow through the API instead of making dummy commits.
    name: Keep schedule enabled
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/enable"

  cron:
    # Keeps the cron-job.org trigger in sync with scripts/sync-cron.js. Runs on push and on request
    # only: the trigger's own dispatches must not call the cron-job.org API (100 requests/day).
    name: Sync cron-job.org trigger
    if: github.event_name == 'push' || inputs.sync_cron
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: node scripts/sync-cron.js

name: Update schedule

on:
  schedule:
    # Every 30 minutes, off the top of the hour to avoid the busiest cron slots.
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

# Never run two updates at once; a queued run waits instead of cancelling a deploy mid-way.
concurrency:
  group: update-schedule
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    name: Fetch, validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read # look up the published site URL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run deterministic tests
        run: npm test

      - name: Find published site
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url) || {
            echo "::error::GitHub Pages is not enabled. Settings → Pages → Source: GitHub Actions."
            exit 1
          }
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"

      - name: Fetch and validate source
        timeout-minutes: 3
        env:
          PREVIOUS_URL: ${{ steps.pages.outputs.url }}/data/latest.json
        run: node scripts/update.js --previous-url "$PREVIOUS_URL"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.run_id }}
          path: diagnostics/
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/

  deploy:
    name: Deploy to GitHub Pages
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  keepalive:
    # GitHub disables scheduled workflows after 60 days without repository activity. Data is not
    # committed, so re-enable this workflow through the API instead of making dummy commits.
    name: Keep schedule enabled
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/enable"
